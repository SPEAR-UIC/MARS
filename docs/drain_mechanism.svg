<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" font-family="monospace, sans-serif">

  <!-- Background -->
  <rect width="960" height="720" fill="#f4f6f8"/>

  <!-- Title -->
  <text x="480" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a252f">MCTS Drain Mechanism — Large Job Starvation Prevention</text>

  <!-- ══════════════════════════════════════════════════
       CLUSTER STATE BOX
  ═══════════════════════════════════════════════════ -->
  <rect x="60" y="52" width="840" height="118" rx="6" fill="#fff" stroke="#bdc3c7" stroke-width="1.5"/>
  <text x="80" y="73" font-size="12" font-weight="bold" fill="#7f8c8d">CLUSTER STATE AT SCHEDULING CYCLE</text>

  <!-- Running jobs strip -->
  <text x="80" y="93" font-size="11" fill="#555">Running:</text>
  <rect x="148" y="80" width="88" height="22" rx="3" fill="#3498db"/>
  <text x="192" y="95" text-anchor="middle" font-size="10" fill="#fff">JobA  4p  ends+30s</text>
  <rect x="242" y="80" width="88" height="22" rx="3" fill="#3498db"/>
  <text x="286" y="95" text-anchor="middle" font-size="10" fill="#fff">JobB  4p  ends+90s</text>
  <text x="342" y="93" font-size="11" fill="#aaa">← 8 procs used, 0 free (of 8 total)</text>

  <!-- Queue strip -->
  <text x="80" y="122" font-size="11" fill="#555">Queue:</text>
  <!-- Large job -->
  <rect x="148" y="109" width="110" height="22" rx="3" fill="#e74c3c"/>
  <text x="203" y="124" text-anchor="middle" font-size="10" fill="#fff">LargeJob  8p  wait 4h</text>
  <!-- Small jobs -->
  <rect x="264" y="109" width="72" height="22" rx="3" fill="#27ae60"/>
  <text x="300" y="124" text-anchor="middle" font-size="10" fill="#fff">SmallA  2p</text>
  <rect x="342" y="109" width="72" height="22" rx="3" fill="#27ae60"/>
  <text x="378" y="124" text-anchor="middle" font-size="10" fill="#fff">SmallB  2p</text>

  <!-- Backfill note -->
  <text x="432" y="122" font-size="10" fill="#aaa">backfill disabled — shadow time blocks SmallA/B under FCFS</text>

  <!-- Available procs bar -->
  <text x="80" y="156" font-size="11" fill="#555">Free procs:</text>
  <rect x="148" y="143" width="200" height="14" rx="2" fill="#ecf0f1" stroke="#bdc3c7"/>
  <rect x="148" y="143" width="0" height="14" rx="2" fill="#e74c3c"/>
  <text x="354" y="154" font-size="10" fill="#c0392b">0 / 8  — LargeJob cannot start</text>

  <!-- ══════════════════════════════════════════════════
       BRANCH GENERATION
  ═══════════════════════════════════════════════════ -->
  <text x="480" y="196" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3e50">Outcome generator produces 2 distinct branches  (ne_count = 1 → full MCTS search)</text>

  <!-- Connector from cluster state to branches -->
  <line x1="480" y1="172" x2="480" y2="190" stroke="#95a5a6" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ══════════════════════════════════════════════════
       LEFT BRANCH — DRAIN
  ═══════════════════════════════════════════════════ -->
  <!-- Branch header -->
  <rect x="60" y="208" width="390" height="38" rx="5" fill="#fef9e7" stroke="#f39c12" stroke-width="1.5"/>
  <text x="255" y="224" text-anchor="middle" font-size="12" font-weight="bold" fill="#e67e22">DRAIN branch  (FCFS ordering)</text>
  <text x="255" y="239" text-anchor="middle" font-size="10" fill="#7f6000">LargeJob at queue head → try_start_job fails → outcome = {}  (empty)</text>

  <!-- Connector line left -->
  <line x1="480" y1="190" x2="255" y2="208" stroke="#f39c12" stroke-width="1.5"/>

  <!-- Timeline for DRAIN -->
  <rect x="76" y="257" width="358" height="178" rx="4" fill="#fffdf5" stroke="#f0c040" stroke-width="1"/>

  <!-- Time axis -->
  <line x1="96" y1="380" x2="420" y2="380" stroke="#bdc3c7" stroke-width="1"/>
  <text x="96"  y="393" font-size="9" fill="#888">now</text>
  <text x="176" y="393" font-size="9" fill="#888">+30s</text>
  <text x="276" y="393" font-size="9" fill="#888">+90s</text>
  <text x="380" y="393" font-size="9" fill="#888">+90s+</text>

  <!-- Time tick marks -->
  <line x1="200" y1="377" x2="200" y2="383" stroke="#bdc3c7" stroke-width="1"/>
  <line x1="300" y1="377" x2="300" y2="383" stroke="#bdc3c7" stroke-width="1"/>
  <line x1="390" y1="377" x2="390" y2="383" stroke="#bdc3c7" stroke-width="1"/>

  <!-- Row labels -->
  <text x="98" y="277" font-size="9" fill="#555">JobA</text>
  <text x="98" y="299" font-size="9" fill="#555">JobB</text>
  <text x="98" y="320" font-size="9" fill="#555">LargeJob</text>
  <text x="98" y="341" font-size="9" fill="#555">SmallA/B</text>
  <text x="98" y="362" font-size="9" fill="#555">Free procs</text>

  <!-- JobA: runs now to +30s, then done -->
  <rect x="150" y="267" width="50" height="14" rx="2" fill="#3498db"/>
  <text x="175" y="277" text-anchor="middle" font-size="8" fill="#fff">running</text>
  <text x="206" y="277" font-size="8" fill="#27ae60">ends → +4p free</text>

  <!-- JobB: runs now to +90s, then done -->
  <rect x="150" y="288" width="150" height="14" rx="2" fill="#3498db"/>
  <text x="225" y="299" text-anchor="middle" font-size="8" fill="#fff">running</text>
  <text x="306" y="299" font-size="8" fill="#27ae60">ends → +4p free  (8p total free)</text>

  <!-- LargeJob: blocked (striped) then starts at +90s -->
  <rect x="150" y="309" width="150" height="14" rx="2" fill="#fadbd8" stroke="#e74c3c" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="225" y="320" text-anchor="middle" font-size="8" fill="#c0392b">blocked — draining</text>
  <rect x="304" y="309" width="86" height="14" rx="2" fill="#e74c3c"/>
  <text x="347" y="320" text-anchor="middle" font-size="8" fill="#fff">STARTS ✓</text>

  <!-- SmallA/B: never start (blocked) -->
  <rect x="150" y="329" width="240" height="14" rx="2" fill="#f0f0f0" stroke="#bdc3c7" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="270" y="340" text-anchor="middle" font-size="8" fill="#aaa">held — drain respects LargeJob reservation</text>

  <!-- Free procs bar over time -->
  <rect x="150" y="350" width="50"  height="14" rx="2" fill="#c0392b" opacity="0.7"/>
  <text x="175" y="360" text-anchor="middle" font-size="7" fill="#fff">0p</text>
  <rect x="200" y="350" width="100" height="14" rx="2" fill="#e67e22" opacity="0.7"/>
  <text x="250" y="360" text-anchor="middle" font-size="7" fill="#fff">4p free</text>
  <rect x="300" y="350" width="90"  height="14" rx="2" fill="#27ae60" opacity="0.7"/>
  <text x="345" y="360" text-anchor="middle" font-size="7" fill="#fff">8p free → LargeJob runs</text>

  <!-- Drain outcome label -->
  <text x="255" y="410" text-anchor="middle" font-size="10" font-weight="bold" fill="#e67e22">LargeJob starts ~90s from now</text>
  <text x="255" y="424" text-anchor="middle" font-size="9" fill="#888">wait_time = 4h + 90s   util_gap = 90s × 8p idle</text>

  <!-- ══════════════════════════════════════════════════
       RIGHT BRANCH — MCTS (start small jobs)
  ═══════════════════════════════════════════════════ -->
  <rect x="510" y="208" width="390" height="38" rx="5" fill="#f0eafa" stroke="#8e44ad" stroke-width="1.5"/>
  <text x="705" y="224" text-anchor="middle" font-size="12" font-weight="bold" fill="#6c3483">MCTS branch  (SJF / WFP ordering)</text>
  <text x="705" y="239" text-anchor="middle" font-size="10" fill="#4a235a">SmallA/B at queue head → start immediately → outcome = {SmallA, SmallB}</text>

  <!-- Connector line right -->
  <line x1="480" y1="190" x2="705" y2="208" stroke="#8e44ad" stroke-width="1.5"/>

  <!-- Timeline for MCTS -->
  <rect x="526" y="257" width="358" height="178" rx="4" fill="#faf5ff" stroke="#c39bd3" stroke-width="1"/>

  <!-- Time axis -->
  <line x1="546" y1="380" x2="870" y2="380" stroke="#bdc3c7" stroke-width="1"/>
  <text x="546" y="393" font-size="9" fill="#888">now</text>
  <text x="640" y="393" font-size="9" fill="#888">+30s</text>
  <text x="730" y="393" font-size="9" fill="#888">+90s</text>
  <text x="820" y="393" font-size="9" fill="#888">later...</text>

  <line x1="660" y1="377" x2="660" y2="383" stroke="#bdc3c7" stroke-width="1"/>
  <line x1="750" y1="377" x2="750" y2="383" stroke="#bdc3c7" stroke-width="1"/>
  <line x1="840" y1="377" x2="840" y2="383" stroke="#bdc3c7" stroke-width="1"/>

  <!-- Row labels -->
  <text x="548" y="277" font-size="9" fill="#555">JobA</text>
  <text x="548" y="299" font-size="9" fill="#555">JobB</text>
  <text x="548" y="320" font-size="9" fill="#555">LargeJob</text>
  <text x="548" y="341" font-size="9" fill="#555">SmallA/B</text>
  <text x="548" y="362" font-size="9" fill="#555">Free procs</text>

  <!-- JobA -->
  <rect x="600" y="267" width="60" height="14" rx="2" fill="#3498db"/>
  <text x="630" y="277" text-anchor="middle" font-size="8" fill="#fff">running</text>
  <text x="666" y="277" font-size="8" fill="#27ae60">ends</text>

  <!-- JobB -->
  <rect x="600" y="288" width="150" height="14" rx="2" fill="#3498db"/>
  <text x="675" y="299" text-anchor="middle" font-size="8" fill="#fff">running</text>
  <text x="756" y="299" font-size="8" fill="#27ae60">ends</text>

  <!-- LargeJob: still blocked much longer -->
  <rect x="600" y="309" width="240" height="14" rx="2" fill="#fadbd8" stroke="#e74c3c" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="720" y="320" text-anchor="middle" font-size="8" fill="#c0392b">blocked — waiting for 8 free procs</text>
  <!-- Eventual start, off-screen-ish -->
  <text x="846" y="320" font-size="8" fill="#c0392b">→ starts much later</text>

  <!-- SmallA/B: start immediately, short duration -->
  <rect x="600" y="329" width="110" height="14" rx="2" fill="#27ae60"/>
  <text x="655" y="340" text-anchor="middle" font-size="8" fill="#fff">SmallA+B running</text>
  <text x="715" y="340" font-size="8" fill="#27ae60">done</text>

  <!-- Free procs bar — stays at 0 most of the time because SmallA/B fill it -->
  <rect x="600" y="350" width="60" height="14" rx="2" fill="#c0392b" opacity="0.7"/>
  <text x="630" y="360" text-anchor="middle" font-size="7" fill="#fff">0p</text>
  <rect x="660" y="350" width="90" height="14" rx="2" fill="#e67e22" opacity="0.7"/>
  <text x="705" y="360" text-anchor="middle" font-size="7" fill="#fff">2-4p free</text>
  <rect x="750" y="350" width="90" height="14" rx="2" fill="#27ae60" opacity="0.7"/>
  <text x="795" y="360" text-anchor="middle" font-size="7" fill="#fff">8p free → LargeJob</text>

  <!-- MCTS outcome label -->
  <text x="705" y="410" text-anchor="middle" font-size="10" font-weight="bold" fill="#6c3483">LargeJob starts ~90s+ from now</text>
  <text x="705" y="424" text-anchor="middle" font-size="9" fill="#888">wait_time = 4h + 90s+   higher util during wait</text>

  <!-- ══════════════════════════════════════════════════
       REWARD COMPARISON
  ═══════════════════════════════════════════════════ -->
  <rect x="60" y="448" width="840" height="118" rx="6" fill="#fff" stroke="#bdc3c7" stroke-width="1.5"/>
  <text x="480" y="468" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3e50">MCTS Reward Comparison — Winner depends on active RewardType</text>

  <!-- Table header -->
  <line x1="80" y1="474" x2="880" y2="474" stroke="#ecf0f1" stroke-width="1"/>
  <text x="170" y="488" text-anchor="middle" font-size="10" font-weight="bold" fill="#7f8c8d">RewardType</text>
  <text x="390" y="488" text-anchor="middle" font-size="10" font-weight="bold" fill="#f39c12">DRAIN outcome</text>
  <text x="620" y="488" text-anchor="middle" font-size="10" font-weight="bold" fill="#8e44ad">MCTS outcome</text>
  <text x="810" y="488" text-anchor="middle" font-size="10" font-weight="bold" fill="#2c3e50">Winner</text>

  <line x1="80" y1="492" x2="880" y2="492" stroke="#ecf0f1" stroke-width="1"/>

  <!-- Row 1 -->
  <text x="170" y="507" text-anchor="middle" font-size="10" fill="#2c3e50">InvCumWait</text>
  <text x="390" y="507" text-anchor="middle" font-size="10" fill="#e67e22">LargeJob wait capped at +90s</text>
  <text x="620" y="507" text-anchor="middle" font-size="10" fill="#8e44ad">LargeJob keeps accumulating wait</text>
  <text x="810" y="507" text-anchor="middle" font-size="10" font-weight="bold" fill="#e67e22">DRAIN ✓</text>

  <!-- Row 2 -->
  <text x="170" y="525" text-anchor="middle" font-size="10" fill="#2c3e50">CumUtil</text>
  <text x="390" y="525" text-anchor="middle" font-size="10" fill="#e67e22">idle gap penalised (8p × 90s unused)</text>
  <text x="620" y="525" text-anchor="middle" font-size="10" fill="#8e44ad">SmallA/B fill gap, higher util</text>
  <text x="810" y="525" text-anchor="middle" font-size="10" font-weight="bold" fill="#8e44ad">MCTS ✓</text>

  <!-- Row 3 -->
  <text x="170" y="543" text-anchor="middle" font-size="10" fill="#2c3e50">InvCumBSLD</text>
  <text x="390" y="543" text-anchor="middle" font-size="10" fill="#e67e22">SmallA/B slowdown spikes (held)</text>
  <text x="620" y="543" text-anchor="middle" font-size="10" fill="#8e44ad">SmallA/B run promptly, low BSLD</text>
  <text x="810" y="543" text-anchor="middle" font-size="10" font-weight="bold" fill="#8e44ad">MCTS ✓</text>

  <!-- Row 4 -->
  <text x="170" y="561" text-anchor="middle" font-size="10" fill="#2c3e50">InvCumWait  (large-job-heavy trace)</text>
  <text x="390" y="561" text-anchor="middle" font-size="10" fill="#e67e22">LargeJob dominates avg wait</text>
  <text x="620" y="561" text-anchor="middle" font-size="10" fill="#8e44ad">Small jobs dilute the average</text>
  <text x="810" y="561" text-anchor="middle" font-size="10" font-weight="bold" fill="#e67e22">DRAIN ✓</text>

  <!-- ══════════════════════════════════════════════════
       CODE PATH NOTE
  ═══════════════════════════════════════════════════ -->
  <rect x="60" y="580" width="840" height="120" rx="6" fill="#eaf4fb" stroke="#aed6f1" stroke-width="1.5"/>
  <text x="480" y="599" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a5276">How it flows through the code</text>

  <text x="80"  y="618" font-size="10" fill="#1a5276">1.  advance_to_decision_point()  [mcts.cpp]  — ne_count == 1 (one non-empty branch) no longer fast-forwards; both branches kept.</text>
  <text x="80"  y="634" font-size="10" fill="#1a5276">2.  search() / parallel_search() [mcts.cpp]  — ne_count == 1 root check removed; full MCTS runs when empty + non-empty coexist.</text>
  <text x="80"  y="650" font-size="10" fill="#1a5276">3.  rollout()                    [mcts.cpp]  — empty-outcome scheduling cycles skip depth increment; drain path not penalised by wasted depth budget.</text>
  <text x="80"  y="666" font-size="10" fill="#1a5276">4.  driver.cpp  log_cycle()                 — selected_policy = DRAIN when q_len≥2 and jobs_scheduled==0; MCTS when jobs_scheduled&gt;0; FCFS when q_len==1.</text>
  <text x="80"  y="682" font-size="10" fill="#1a5276">5.  default_scheduling_cycle()  [simulator]  — FCFS puts LargeJob first; backfill shadow-time blocks SmallA/B; outcome={} → DRAIN branch identified.</text>
  <text x="80"  y="698" font-size="10" fill="#1a5276">6.  SJF / WFP put SmallA/B first; they start via FIFO dispatch; outcome={SmallA,SmallB} → MCTS branch identified.</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#95a5a6"/>
    </marker>
  </defs>

</svg>
